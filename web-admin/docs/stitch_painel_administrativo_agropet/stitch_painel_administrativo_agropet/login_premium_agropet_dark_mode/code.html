<body class="bg-surface-dim min-h-screen flex items-center justify-center antialiased text-on-background">
<main class="flex min-h-screen w-full">
<!-- Decorative Side (Left) -->
<div class="hidden lg:flex lg:w-1/2 relative bg-surface items-center justify-center overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-transparent opacity-50"></div>
<div class="relative z-10 text-center p-2xl">
<div class="mb-xl inline-flex items-center justify-center w-24 h-24 rounded-full bg-primary/10 border border-primary/20 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary text-[48px]">pets</span>
</div>
<h2 class="font-display-lg text-headline-xl text-on-background mb-md">AgroPet Noir</h2>
<p class="font-body-lg text-on-surface-variant max-w-sm mx-auto">Gestão premium para o seu negócio pet. Simplicidade, elegância e controle total.</p>
</div>
<!-- Subtle Glow Effect -->
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-primary/10 rounded-full blur-[120px]"></div>
</div>
<!-- Functional Side (Right) -->
<div class="w-full lg:w-1/2 flex flex-col items-center justify-center p-md lg:p-2xl bg-surface-dim relative">
<div class="w-full max-w-md">
<!-- Mobile Logo -->
<div class="lg:hidden text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary">AgroPet</h1>
</div>
<div class="bg-surface-container/40 backdrop-blur-2xl border border-outline-variant/30 rounded-2xl shadow-2xl p-xl lg:p-2xl relative overflow-hidden">
<!-- Subtle Inner Glow -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
<div class="mb-xl">
<h2 class="font-display-lg text-headline-lg text-on-background mb-xs">Bem-vindo</h2>
<p class="font-body-sm text-on-surface-variant">Acesse sua conta administrativa</p>
</div>
<form action="#" class="space-y-lg" method="POST">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">E-mail Profissional</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full pl-[44px] pr-md py-[12px] bg-surface-container-lowest/50 border border-outline-variant/50 rounded-xl font-body-md text-on-surface placeholder:text-on-surface-variant/30 focus:border-primary/50 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="email" name="email" placeholder="admin@agropet.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Senha</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-[44px] pr-md py-[12px] bg-surface-container-lowest/50 border border-outline-variant/50 rounded-xl font-body-md text-on-surface placeholder:text-on-surface-variant/30 focus:border-primary/50 focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between pt-sm">
<div class="flex items-center gap-sm">
<input class="h-4 w-4 bg-surface-container-highest rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-dim" id="remember-me" name="remember-me" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="remember-me">Lembrar acesso</label>
</div>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">Esqueceu a senha?</a>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-[14px] rounded-xl shadow-lg shadow-primary/10 hover:bg-primary-fixed hover:shadow-primary/20 focus:ring-4 focus:ring-primary/20 transition-all flex items-center justify-center gap-sm mt-xl" type="submit">
            Entrar no Painel
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<div class="text-center mt-xl">
<p class="font-body-sm text-body-sm text-on-surface-variant/50">
          © 2024 AgroPet Noir. Todos os direitos reservados.
        </p>
</div>
</div>
</div>
