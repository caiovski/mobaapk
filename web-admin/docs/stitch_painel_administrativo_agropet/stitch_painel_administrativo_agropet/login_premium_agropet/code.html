<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AgroPet - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "outline-variant": "#dfc1af",
                            "primary": "#964900",
                            "inverse-surface": "#3b2e26",
                            "secondary": "#565e71",
                            "surface-container-low": "#fff1ea",
                            "tertiary": "#006399",
                            "surface-container-lowest": "#ffffff",
                            "surface-dim": "#ecd6ca",
                            "outline": "#8b7263",
                            "inverse-primary": "#ffb787",
                            "tertiary-container": "#00a7fd",
                            "on-background": "#241912",
                            "surface-tint": "#964900",
                            "background": "#fff8f5",
                            "on-secondary": "#ffffff",
                            "primary-fixed": "#ffdcc7",
                            "on-error": "#ffffff",
                            "on-surface": "#241912",
                            "surface-container-high": "#fae4d8",
                            "on-tertiary-fixed-variant": "#004b74",
                            "on-primary-fixed": "#311300",
                            "inverse-on-surface": "#ffede4",
                            "on-primary-container": "#5a2900",
                            "primary-fixed-dim": "#ffb787",
                            "error": "#ba1a1a",
                            "on-tertiary": "#ffffff",
                            "on-primary": "#ffffff",
                            "on-surface-variant": "#574235",
                            "on-error-container": "#93000a",
                            "surface-variant": "#f4ded2",
                            "surface": "#fff8f5",
                            "secondary-fixed": "#dbe2f8",
                            "secondary-fixed-dim": "#bec6dc",
                            "on-secondary-fixed-variant": "#3f4758",
                            "on-secondary-container": "#5b6375",
                            "surface-container-highest": "#f4ded2",
                            "on-tertiary-fixed": "#001d32",
                            "primary-container": "#f97d01",
                            "secondary-container": "#d8dff5",
                            "on-primary-fixed-variant": "#723600",
                            "on-tertiary-container": "#00395b",
                            "tertiary-fixed": "#cde5ff",
                            "error-container": "#ffdad6",
                            "surface-bright": "#fff8f5",
                            "on-secondary-fixed": "#131c2b",
                            "surface-container": "#ffeade",
                            "tertiary-fixed-dim": "#94ccff"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "md": "16px",
                            "xs": "4px",
                            "margin": "32px",
                            "gutter": "24px",
                            "lg": "24px",
                            "base": "4px",
                            "xl": "32px",
                            "sm": "8px",
                            "2xl": "48px"
                    },
                    "fontFamily": {
                            "body-md": ["Inter"],
                            "title-lg": ["Inter"],

                            "label-sm": ["Inter"],
                            "display-lg": ["Inter"],

                            "label-md": ["Inter"]
                    },
                    "fontSize": {
                            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                            "title-lg": ["18px", {"lineHeight": "28px", "fontWeight": "600"}],
                            "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],

                }

        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex antialiased text-on-surface">
<main class="flex w-full min-h-screen">
<!-- Left Side: Decorative Panel -->
<div class="hidden lg:flex lg:w-1/2 bg-primary-container relative overflow-hidden items-center justify-center p-2xl">
<div class="absolute inset-0 opacity-10 pointer-events-none">
<!-- Subtle Pattern Overlay -->
<svg class="w-full h-full" height="100" viewbox="0 0 100 100" width="100" xmlns="http://www.w3.org/2000/svg">
<path d="M25 10c-5.5 0-10 4.5-10 10s4.5 10 10 10 10-4.5 10-10-4.5-10-10-10zm50 0c-5.5 0-10 4.5-10 10s4.5 10 10 10 10-4.5 10-10-4.5-10-10-10zM50 40c-5.5 0-10 4.5-10 10s4.5 10 10 10 10-4.5 10-10-4.5-10-10-10zM25 70c-5.5 0-10 4.5-10 10s4.5 10 10 10 10-4.5 10-10-4.5-10-10-10zm50 0c-5.5 0-10 4.5-10 10s4.5 10 10 10 10-4.5 10-10-4.5-10-10-10z" fill="currentColor"></path>
</svg>
</div>
<div class="relative z-10 text-center text-white">
<h1 class="font-display-lg text-[48px] leading-tight mb-md">AgroPet</h1>
<p class="text-body-md opacity-90 max-w-sm mx-auto">Cuidando de quem você ama com a excelência que o campo e a cidade exigem.</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex flex-col items-center justify-center p-xl bg-surface">
<div class="w-full max-w-[400px]">
<div class="mb-xl">
<h2 class="font-display-lg text-display-lg text-on-surface mb-xs">Bem-vindo de volta</h2>
<p class="font-body-md text-on-surface-variant">Acesse o painel administrativo da AgroPet</p>
</div>
<form action="#" class="space-y-lg" method="POST">
<div class="space-y-xs">
<label class="font-label-md text-on-surface" for="email">E-mail</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full pl-[44px] pr-md py-[12px] bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="email" name="email" placeholder="admin@agropet.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-on-surface" for="password">Senha</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-[44px] pr-md py-[12px] bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between pt-sm">
<div class="flex items-center gap-sm">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember-me" name="remember-me" type="checkbox"/>
<label class="font-body-sm text-on-surface-variant" for="remember-me">Lembrar-me</label>
</div>
<a class="font-label-md text-primary hover:text-on-primary-container transition-colors" href="#">Esqueci minha senha</a>
</div>
<button class="w-full bg-primary-container text-white font-label-md py-[14px] rounded-xl shadow-lg shadow-primary-container/20 hover:bg-on-primary-container hover:shadow-xl transition-all flex items-center justify-center gap-sm mt-xl" type="submit">
                    Entrar no Sistema
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-2xl text-center">
<p class="font-body-sm text-on-surface-variant/70">
                    © 2024 AgroPet. Todos os direitos reservados.
                </p>
</div>
</div>
</div>
</main>
</body></html>
